<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>博客拼图工具</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="logo">▦</span> 博客拼图工具</div><div class="actions"><span class="privacy">● 图片仅在本机处理</span><button id="language" type="button">English</button><button id="undo" title="撤销 Ctrl / ⌘ Z">↶ 撤销</button><button id="redo" title="重做">↷</button><button id="save">保存工程</button><button id="load">打开工程</button><button class="primary" id="export">导出图片 ↗</button></div></header>
<main><aside class="library"><div class="section-title">照片素材 <span id="count">0 张</span></div><label class="upload" id="dropzone"><span>＋</span><strong>添加你的照片</strong><small>点击选择，或拖入多张图片</small><input id="files" type="file" accept="image/*" multiple hidden></label><p class="hint">点击照片填入选中格子，也可拖到画布。支持 JPG、PNG、WebP。</p><div id="assets" class="assets"></div><div class="library-bottom"><span>导入照片，调整布局，<br>导出适合博客的拼图。</span><button id="demo">添加示例照片 ↗</button></div></aside>
<section class="workspace"><div class="workspace-top"><div><h1>编辑拼图</h1></div><span id="dimensions" class="badge"></span></div><div class="stage" id="stage"><div id="board"><canvas id="canvas"></canvas><div id="cells"></div></div></div><div class="canvas-footer"><span>拖动照片调整位置 · 滚轮缩放 · 点击格子编辑</span><button id="fill">自动填入照片</button></div><section class="presets"><div class="section-title">从一个布局开始 <span>保留已导入的素材</span></div><div id="presets"></div></section></section>
<aside class="settings"><section><h2>画布设置</h2><label>整体比例<select id="ratio"><option value="1.5">3 : 2 · 博客推荐</option><option value="1.7777777778">16 : 9 · 横向宽幅</option><option value="1.3333333333">4 : 3 · 经典</option><option value="1">1 : 1 · 方形</option><option value="0.75">3 : 4 · 竖向</option><option value="custom">自定义</option></select></label><div class="pair"><label>宽度 px<input id="width" type="number" min="320" max="6000"></label><label>高度 px<input id="height" type="number" min="320" max="6000"></label></div><label class="range-label">图片间距 <output id="gapValue"></output><input id="gap" type="range" min="0" max="80"></label><label class="range-label">外边距 <output id="paddingValue"></output><input id="padding" type="range" min="0" max="120"></label><label class="color-label">背景颜色<input id="background" type="color"></label></section>
<section><div class="section-title">行布局 <button id="addRow">＋ 添加行</button></div><div id="rows"></div></section>
<section id="selected-settings"><h2 id="selected-title">照片调整</h2><label class="range-label">格子宽度占比 <output id="weightValue"></output><input id="weight" type="range" min="0.3" max="3" step="0.1"></label><label class="range-label">照片缩放 <output id="zoomValue"></output><input id="zoom" type="range" min="1" max="4" step="0.01"></label><div class="pair"><button id="reset">重置位置</button><button id="remove">移除照片</button></div><p class="hint">格子比例由画布、行高和宽度占比共同决定。相邻照片会自动重新排版。</p></section>
<section><h2>导出设置</h2><label>文件格式<select id="format"><option value="image/jpeg">JPG · 适合博客，文件更小</option><option value="image/png">PNG · 无损高清</option><option value="image/webp">WebP · 轻巧清晰</option></select></label><label>文件名称<input id="filename" value="博客拼图"></label><p class="hint">按画布的实际像素导出，不受预览大小影响。</p></section></aside></main><input hidden id="project" type="file" accept=".json"><div id="toast" role="status"></div><script src="i18n.js"></script><script src="app.js"></script></body></html>
